<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" role="img" aria-labelledby="svh-logo-title">
  <title id="svh-logo-title">Svaleholm Gæstegaard – Roskilde</title>
  <!-- Emblem: svale over gavl (jf. brandkoncept) -->
  <g>
    <circle cx="92" cy="90" r="78" fill="#F3F1EB"/>
    <circle cx="92" cy="90" r="78" fill="none" stroke="#1E3B36" stroke-width="2.5"/>
    <!-- Gavl / hus-ende -->
    <g fill="none" stroke="#1E3B36" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M60 130 L60 94 L124 94 L124 130"/>
      <path d="M50 98 L92 62 L134 98"/>
    </g>
    <rect x="83" y="110" width="18" height="20" fill="#1E3B36"/>
    <!-- Svale (sitets egen figur) over gavlen, i halm-guld -->
    <path transform="translate(46,22) scale(0.92)" fill="#C29B4F"
      d="M50 20 C 40 10, 20 3, 2 6 C 22 10, 37 16, 48 22 L 43 34 L 50 26 L 57 34 L 52 22 C 63 16, 78 10, 98 6 C 80 3, 60 10, 50 20 Z"/>
  </g>
  <!-- Ordmærke -->
  <text x="198" y="88" font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#1E3B36">Svaleholm</text>
  <text x="200" y="120" font-family="'Work Sans', Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#9C4A32" letter-spacing="7">GÆSTEGAARD · ROSKILDE</text>
</svg>
