---
# Customer Site Deployment (React Router 7 SSR via Node.js)
#
# Serves the customer's public-facing website via server-side rendering.
# Fetches content from the WordPress WP-REST API.
# Each customer has a unique Docker image built from their forked repo.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-site
  namespace: {{NAMESPACE}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: customer-site
      customer: "{{CUSTOMER_ID}}"

  template:
    metadata:
      labels:
        app: customer-site
        customer: "{{CUSTOMER_ID}}"
    spec:
      containers:
        - name: customer-site
          image: registry.scaleweb.dk/{{NAMESPACE}}-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: WP_API_URL
              value: "http://wordpress:80/wp-json"

            # Contact-form relay → crm-backend POST /internal/site-submission.
            #
            # Identifies by slug rather than customerId because {{CUSTOMER_ID}}
            # means different things per deploy path: the legacy workflow in
            # .github/workflows/ substitutes the namespace, while CRM's
            # buildTemplateVariables (kubernetes.ts) substitutes the numeric
            # customer id. {{NAMESPACE}} is unambiguous, and crm-backend treats
            # slug as the preferred identifier anyway.
            - name: CRM_API_URL
              value: "http://crm-backend.crm-system.svc.cluster.local:5000"
            - name: CRM_SLUG
              value: "{{NAMESPACE}}"
            # crm-backend's shared AGENT_API_TOKEN, provisioned per namespace
            # as crm-internal-secret by CRM (kubernetes.ts, "lets the customer
            # site call /internal/* on crm-backend").
            #
            # Optional, and the app treats an empty value as unconfigured: the
            # secret is written with createOrSkipSecret, so a namespace
            # provisioned while crm-backend lacked AGENT_API_TOKEN keeps an
            # empty token forever. Either way the contact form degrades to
            # showing the phone number and e-mail address rather than
            # silently dropping enquiries.
            - name: CRM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crm-internal-secret
                  key: token
                  optional: true

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # SSR is bursty: a 200m limit CFS-throttles request bursts and drives
              # variable TTFB. 1 core lets Node SSR burst per request.
              cpu: 1000m
              # 128Mi left <10% headroom over the ~115Mi SSR baseline and paged
              # CustomerPodMemoryNearLimit (incident 2026-07-10 / CRM#433).
              memory: 256Mi

      imagePullSecrets:
        - name: registry-credentials

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

---
apiVersion: v1
kind: Service
metadata:
  name: customer-site
  namespace: {{NAMESPACE}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
